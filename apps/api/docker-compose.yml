# Pinned project name: this file used to live in a folder called back-alacena,
# so the existing alacena-db container and alacena-pgdata volume belong to the
# "back-alacena" project. Keeping the name reuses them instead of conflicting.
name: backend

services:
  db:
    image: postgres:16
    container_name: alacena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alacena
      POSTGRES_PASSWORD: alacena
      POSTGRES_DB: alacena
    ports:
      - "5433:5432"
    volumes:
      - alacena-pgdata:/var/lib/postgresql/data

  # API + web app in one container. Opt-in so `docker compose up -d db` is unchanged:
  #   docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://alacena:alacena@db:5432/alacena?schema=public
      PORT: "3001"
    ports:
      - "3001:3001"

volumes:
  alacena-pgdata:
